services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DB_HOST: db
      DB_USER: uiu
      DB_PASSWORD: uiu123
      DB_NAME: uiu_collabhub
    depends_on:
      - db

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: uiu_collabhub
      MARIADB_USER: uiu
      MARIADB_PASSWORD: uiu123
    volumes:
      - ../database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
      - database-data:/var/lib/mysql

volumes:
  database-data:
